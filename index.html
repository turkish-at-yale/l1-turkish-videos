<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L1 Turkish Videos</title>
<meta name="description" content="Lesson videos for L1 Turkish, organised by week.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2300356b'/%3E%3Cpath d='M13 10l10 6-10 6z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --blue: #00356b;
    --blue-light: #286dc0;
    --text: #222;
    --muted: #666;
    --line: #dcdcdc;
    --bg: #fff;
    --serif: "YaleNew", Georgia, "Times New Roman", serif;
    --sans: "Mallory", Verdana, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); }
  a:hover { color: var(--blue-light); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* Top band */
  .band { background: var(--blue); color: #fff; }
  .band .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
  .band .name { font-family: var(--serif); font-size: 20px; letter-spacing: .01em; color: #fff; text-decoration: none; }
  .band .drive { color: #fff; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .band .drive:hover { color: #fff; }
  .band .drive svg { width: 15px; height: 15px; }

  /* Title */
  .title { border-bottom: 3px solid var(--blue); padding: 40px 0 14px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.1; margin: 0; color: var(--blue); }
  .weeknav { padding: 14px 0 0; font-size: 15px; }
  .weeknav a { margin-right: 20px; white-space: nowrap; display: inline-block; }

  /* Weeks */
  main { padding: 20px 0 60px; }
  section.week { padding: 34px 0 6px; scroll-margin-top: 16px; }
  .week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; color: var(--blue); }
  .week-head a { font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px 20px; }
  .card { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #eef1f5; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; clip-path: inset(0 round 12px);
    will-change: transform; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .card:hover .thumb, .card:focus-visible .thumb { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 28px rgba(0,53,107,.16); border-color: transparent; }
  .card:hover .thumb img { transform: scale(1.05); }
  .thumb .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%; background: rgba(0,53,107,.9);
    display: grid; place-items: center; transition: background .2s, transform .25s ease;
  }
  .card:hover .play { transform: translate(-50%, -50%) scale(1.1); }
  .thumb .play svg { width: 16px; height: 16px; margin-left: 3px; fill: #fff; }
  .card:hover .play, .card:focus-visible .play { background: var(--blue-light); }
  .card:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 4px; border-radius: 12px; }
  .card-title { margin: 12px 0 0; font-size: 15.5px; color: var(--text); transition: color .2s; }
  .card:hover .card-title { color: var(--blue-light); }

  .slides { margin-top: 22px; font-size: 14.5px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .slides a { white-space: nowrap; }

  /* Links whose underline grows in from the left on hover */
  .u { position: relative; text-decoration: none; padding-bottom: 2px; }
  .u::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1.5px; background: currentColor;
    transform: scaleX(0); transform-origin: left; transition: transform .28s ease; }
  .u:hover::after, .u:focus-visible::after { transform: scaleX(1); }
  .empty { color: var(--muted); margin: 0; font-size: 15px; }

  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 13.5px; }

  /* Player */
  .modal { position: fixed; inset: 0; z-index: 50; display: none; }
  .modal.open { display: block; }
  .modal .backdrop { position: absolute; inset: 0; background: rgba(0,20,45,.8); }
  .player {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(1100px, calc(100vw - 32px)); background: #000; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border-radius: 14px; overflow: hidden;
    animation: pop .22s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .modal .backdrop { animation: fade .2s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .player-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; background: var(--blue); color: #fff; }
  .player-bar h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-bar .sub { font-family: var(--sans); font-size: 13px; opacity: .8; margin-left: 10px; }
  .player-bar .tools { display: flex; gap: 6px; flex: none; }
  .ibtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.45); background: transparent; color: #fff; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  .ibtn:hover { background: rgba(255,255,255,.14); border-color: #fff; color: #fff; }
  .ibtn { transition: background .15s, border-color .15s; }
  .ibtn svg { width: 15px; height: 15px; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player:fullscreen, .player:-webkit-full-screen { width: 100vw; height: 100vh; transform: none; left: 0; top: 0; border-radius: 0; animation: none; }
  .player:fullscreen .frame, .player:-webkit-full-screen .frame { flex: 1; aspect-ratio: auto; }
  @media (max-width: 600px) {
    h1 { font-size: 34px; }
    .player-bar .tools .txt { display: none; }
  }
</style>
</head>
<body>

<div class="band">
  <div class="wrap">
    <span class="name">Turkish at Yale</span>
    <a class="drive u" id="drive-root" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open in Google Drive
    </a>
  </div>
</div>

<header class="wrap">
  <div class="title"><h1>L1 Turkish Videos</h1></div>
  <nav class="weeknav" id="week-nav" aria-label="Weeks"></nav>
</header>

<main><div class="wrap" id="content"></div></main>

<footer><div class="wrap">Videos are streamed from Google Drive. If a video will not play here, open it in Drive.</div></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="player-title">
  <div class="backdrop" data-close></div>
  <div class="player" id="player">
    <div class="player-bar">
      <h3 id="player-title"></h3>
      <div class="tools">
        <button class="ibtn" id="fs-btn" type="button" title="Full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <span class="txt">Full screen</span>
        </button>
        <a class="ibtn" id="drive-btn" href="#" target="_blank" rel="noopener" title="Open in Google Drive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
          <span class="txt">Open in Drive</span>
        </a>
        <button class="ibtn" type="button" data-close title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="frame"><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen title="Video player"></iframe></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const folderUrl = id => `https://drive.google.com/drive/folders/${id}`;
  const fileUrl = id => `https://drive.google.com/file/d/${id}/view`;
  const previewUrl = id => `https://drive.google.com/file/d/${id}/preview`;
  const thumbUrl = id => `https://drive.google.com/thumbnail?id=${id}&sz=w640`;
  const slidesUrl = id => `https://docs.google.com/presentation/d/${id}/edit`;
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

  document.getElementById('drive-root').href = folderUrl(DRIVE_ROOT);

  const nav = document.getElementById('week-nav');
  const content = document.getElementById('content');
  const playIcon = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';

  WEEKS.forEach(w => {
    const id = slug(w.label);
    const a = document.createElement('a');
    a.href = '#' + id; a.textContent = w.label; a.className = 'u';
    nav.appendChild(a);

    const sec = document.createElement('section');
    sec.className = 'week'; sec.id = id;
    sec.innerHTML = `
      <div class="week-head">
        <h2>${w.label}</h2>
        <a class="u" href="${folderUrl(w.folder)}" target="_blank" rel="noopener">Drive folder</a>
      </div>`;

    if (w.videos.length) {
      const grid = document.createElement('div'); grid.className = 'grid';
      w.videos.forEach(v => {
        const card = document.createElement('button');
        card.className = 'card'; card.type = 'button';
        card.innerHTML = `
          <div class="thumb">
            <img src="${thumbUrl(v.id)}" alt="" loading="lazy" onerror="this.remove()">
            <span class="play">${playIcon}</span>
          </div>
          <p class="card-title">${v.title}</p>`;
        card.addEventListener('click', () => openPlayer(v, w));
        grid.appendChild(card);
      });
      sec.appendChild(grid);
    } else {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'No videos for this week yet.';
      sec.appendChild(p);
    }

    if (w.slides.length) {
      const row = document.createElement('p'); row.className = 'slides';
      row.innerHTML = '<span>Slides</span>' + w.slides.map(s =>
        `<a class="u" href="${slidesUrl(s.id)}" target="_blank" rel="noopener">${s.title}</a>`).join('');
      sec.appendChild(row);
    }
    content.appendChild(sec);
  });

  // Player
  const modal = document.getElementById('modal');
  const player = document.getElementById('player');
  const frame = document.getElementById('frame');
  const title = document.getElementById('player-title');
  const driveBtn = document.getElementById('drive-btn');
  const fsBtn = document.getElementById('fs-btn');
  let lastFocus = null;

  function openPlayer(v, w) {
    lastFocus = document.activeElement;
    title.innerHTML = `${v.title}<span class="sub">${w.label}</span>`;
    driveBtn.href = fileUrl(v.id);
    frame.src = previewUrl(v.id);
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    fsBtn.focus();
  }
  function closePlayer() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
    modal.classList.remove('open');
    frame.src = '';
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  fsBtn.addEventListener('click', () => {
    const req = player.requestFullscreen || player.webkitRequestFullscreen;
    if (req) req.call(player);
    else window.open(frame.src, '_blank'); // iOS Safari fallback
  });
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closePlayer));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closePlayer(); });
})();
</script>
</body>
</html>
